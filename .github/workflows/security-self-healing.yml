name: 🛡️ Security Self-Healing

on:
  workflow_run:
    workflows: ["DevSecOps Pipeline"]
    types: [completed]
    branches: [master]

permissions:
  contents: read

concurrency:
  group: security-self-healing-${{ github.ref }}
  cancel-in-progress: false

jobs:
  close-resolved-issues:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    # Hanya berjalan jika pipeline utama BERHASIL (Success)
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: 🔍 Find and Close Resolved Security Issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ✅ FIXED 1: Mendeklarasikan target repositori secara eksplisit
          REPO: ${{ github.repository }}
        run: |
          echo "Pipeline sukses! Memulai pembersihan tiket keamanan..."
          
          # Deny-by-default: hanya tiket yang eksplisit opt-in untuk auto-remediation.
          ISSUES=$(gh issue list -R "$REPO" --label "security" --label "auto-remediate" --state open --json number --jq '.[].number')
          
          if [ -z "$ISSUES" ]; then
            echo "✅ Tidak ada tiket security auto-remediate yang terbuka."
            exit 0
          fi
          
          for ISSUE_NUMBER in $ISSUES; do
            echo "Closing issue #$ISSUE_NUMBER..."
            
            gh issue comment "$ISSUE_NUMBER" -R "$REPO" --body "✅ **Self-Healing Triggered**: DevSecOps Pipeline build #${{ github.event.workflow_run.run_number }} sukses. Tiket ini memiliki label \`auto-remediate\`, jadi ditutup otomatis sesuai policy."
            
            gh issue close "$ISSUE_NUMBER" -R "$REPO" --reason "completed"
          done
