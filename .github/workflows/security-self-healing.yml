name: 🛡️ Security Resolution Evidence

on:
  workflow_run:
    workflows: ["DevSecOps Pipeline"]
    types: [completed]
    branches: [master]

permissions:
  contents: read

concurrency:
  group: security-resolution-evidence-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  record-resolution-evidence:
    name: Record security verification evidence
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write

    steps:
      - name: Harden the runner (block unapproved egress)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443

      - name: Add evidence comment without closing issues
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail

          # The auto-remediate label is an explicit opt-in for evidence comments.
          # A green global pipeline is supporting evidence, not proof that every
          # issue is resolved, so this workflow never closes or relabels issues.
          ISSUES=$(gh issue list \
            --repo "$REPO" \
            --label "security" \
            --label "auto-remediate" \
            --state open \
            --limit 100 \
            --json number \
            --jq '.[].number')

          if [[ -z "$ISSUES" ]]; then
            echo "No open security issues opted in for resolution evidence."
            exit 0
          fi

          MARKER="<!-- security-evidence:workflow-run:${RUN_ID} -->"
          COMMENT_FILE="$RUNNER_TEMP/security-evidence-comment.md"
          {
            echo "$MARKER"
            echo "### 🛡️ Pipeline evidence available — manual verification required"
            echo
            echo "DevSecOps Pipeline [run #${RUN_NUMBER}](${RUN_URL}) completed successfully for commit \`${RUN_SHA}\`."
            echo
            echo "This is supporting evidence only. It does **not** prove that this issue is resolved, and this automation will not close or relabel the issue. The owner must verify the original finding, affected artifact, and remediation before closing it."
          } > "$COMMENT_FILE"

          while IFS= read -r ISSUE_NUMBER; do
            [[ "$ISSUE_NUMBER" =~ ^[0-9]+$ ]] || {
              echo "::error::GitHub returned an invalid issue number."
              exit 1
            }

            EXISTING_COMMENT=$(gh api \
              --paginate \
              "repos/$REPO/issues/$ISSUE_NUMBER/comments" \
              --jq ".[] | select(.body | contains(\"$MARKER\")) | .id")

            if [[ -n "$EXISTING_COMMENT" ]]; then
              echo "Issue #$ISSUE_NUMBER already contains evidence for workflow run $RUN_ID."
              continue
            fi

            gh issue comment "$ISSUE_NUMBER" \
              --repo "$REPO" \
              --body-file "$COMMENT_FILE"
          done <<< "$ISSUES"
