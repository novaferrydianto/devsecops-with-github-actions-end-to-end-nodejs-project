name: 🚀 Lint Workflows (actionlint)

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/**.yml'
      - '.github/workflows/**.yaml'
  pull_request:
    paths:
      - '.github/workflows/**.yml'
      - '.github/workflows/**.yaml'

# ✅ SRE Best Practice: Hemat antrean runner dengan membatalkan proses lama
concurrency:
  group: actionlint-${{ github.ref }}
  cancel-in-progress: true

# ✅ PoLP: Read repo content, write check annotations for reviewdog
permissions:
  contents: read
  checks: write

jobs:
  actionlint:
    runs-on: ubuntu-latest
    name: 🧩 Check YAML Quality
    timeout-minutes: 5
    steps:
      # ✅ Hardened: SHA Pinning untuk checkout
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        
      # ✅ Hardened & FIXED: Menggunakan action resmi reviewdog/action-actionlint
      - name: Run Actionlint
        uses: step-security/action-actionlint@c3aa382d371c6b05513ae5907d4f77713e21813c # v1.72.0
