name: 🚀 Lint Workflows (actionlint)

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/**.yml'
      - '.github/workflows/**.yaml'
  pull_request:
    paths:
      - '.github/workflows/**.yml'
      - '.github/workflows/**.yaml'

# ✅ SRE Best Practice: Hemat antrean runner dengan membatalkan proses lama
concurrency:
  group: actionlint-${{ github.ref }}
  cancel-in-progress: true

# ✅ PoLP: Global lockdown to read-only
permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    name: 🧩 Check YAML Quality
    timeout-minutes: 5
    permissions:
      contents: read
      checks: write
    steps:
      # ✅ Hardened: SHA Pinning untuk checkout
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            raw.githubusercontent.com:443

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
        
      # ✅ Hardened & FIXED: Menggunakan action resmi reviewdog/action-actionlint
      - name: Run Actionlint
        uses: step-security/action-actionlint@c3aa382d371c6b05513ae5907d4f77713e21813c # v1.72.0
        with:
          # reviewdog defaults `fail_level: none`, which means "always exit 0" —
          # findings would only ever appear as annotations and this job would
          # stay green with broken workflows. Make it an actual gate.
          fail_level: error
