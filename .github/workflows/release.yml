name: 🚀 Production Release & Signing

on:
  push:
    tags:
      # GitHub tag filters are globs. The validation job below enforces strict
      # SemVer 2.0.0 before any artifact is signed or published.
      - 'v*'

run-name: Release ${{ github.ref_name }} from trusted master

# Serialize every production release. Never cancel a run that may already be
# signing or publishing an immutable artifact.
concurrency:
  group: production-release
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  COSIGN_VERSION: v2.6.4
  EXPECTED_COSIGN_ISSUER: https://token.actions.githubusercontent.com
  EXPECTED_COSIGN_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
  EXPECTED_IMAGE_COSIGN_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/devsecops-pipeline.yaml@refs/heads/master

jobs:
  validate_and_package:
    name: 🛡️ Validate trusted release source
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      deployments: read
    outputs:
      archive_name: ${{ steps.package.outputs.archive_name }}
      checksums_digest: ${{ steps.package.outputs.checksums_digest }}
      image_digest: ${{ steps.image.outputs.image_digest }}
      image_ref: ${{ steps.image.outputs.image_ref }}
      image_tag: ${{ steps.image.outputs.image_tag }}
      is_prerelease: ${{ steps.trust.outputs.is_prerelease }}
      master_sha: ${{ steps.trust.outputs.master_sha }}
      release_environment: ${{ steps.governance.outputs.release_environment }}
      tag_commit: ${{ steps.trust.outputs.tag_commit }}
      tag_object: ${{ steps.trust.outputs.tag_object }}
      trusted_run_id: ${{ steps.trust.outputs.trusted_run_id }}
      trusted_run_url: ${{ steps.trust.outputs.trusted_run_url }}
    steps:
      - name: Harden the runner (deny-all egress)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            auth.docker.io:443
            index.docker.io:443
            registry-1.docker.io:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
            rekor.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443

      - name: Require protected tag and release environment governance
        id: governance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if ! RULESETS_JSON="$(
            gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/rulesets" \
              -f includes_parents=true \
              -f per_page=100
          )"; then
            echo "::error::Cannot read repository rulesets with the workflow token; release governance cannot be proven."
            exit 1
          fi

          TAG_RULESET_VALID=false
          while IFS= read -r ruleset_id; do
            [[ "$ruleset_id" =~ ^[0-9]+$ ]] || continue
            RULESET_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/rulesets/${ruleset_id}")" || {
              echo "::error::Cannot inspect tag ruleset ${ruleset_id}."
              exit 1
            }

            if jq -e '
              .target == "tag"
              and .enforcement == "active"
              and .conditions.ref_name.include == ["refs/tags/v*"]
              and .conditions.ref_name.exclude == []
              and ([.rules[].type] | index("deletion") != null)
              and ([.rules[].type] | index("update") != null)
              and ([.rules[].type] | index("creation") == null)
              and ((.bypass_actors // []) | length == 0)
            ' <<< "$RULESET_JSON" > /dev/null; then
              TAG_RULESET_VALID=true
              break
            fi
          done < <(
            jq -r '.[] | select(.target == "tag" and .enforcement == "active") | .id' \
              <<< "$RULESETS_JSON"
          )

          [[ "$TAG_RULESET_VALID" == 'true' ]] || {
            echo "::error::An active tag ruleset must exclusively cover refs/tags/v* with zero exclusions, protect update/deletion without restricting creation, and have zero bypass actors."
            exit 1
          }

          ENVIRONMENT_JSON="$(
            gh api "repos/${GITHUB_REPOSITORY}/environments/production-release"
          )" || {
            echo "::error::The production-release environment does not exist or cannot be inspected."
            exit 1
          }
          jq -e '
            any(
              .protection_rules[]?;
              .type == "wait_timer"
              and (.wait_timer | type == "number")
              and .wait_timer >= 15
            )
            and ([
              .protection_rules[]? | select(.type == "required_reviewers")
            ] | length == 0)
            and .deployment_branch_policy.protected_branches == false
            and .deployment_branch_policy.custom_branch_policies == true
          ' <<< "$ENVIRONMENT_JSON" > /dev/null || {
            echo "::error::production-release must enforce a wait timer of at least 15 minutes, have zero required reviewers, and use custom deployment policies only."
            exit 1
          }

          DEPLOYMENT_POLICIES_JSON="$(
            gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/environments/production-release/deployment-branch-policies" \
              -f per_page=100
          )" || {
            echo "::error::Cannot inspect production-release deployment tag policies."
            exit 1
          }
          jq -e '
            ([.branch_policies[]? | {type, name}]
              == [{type: "tag", name: "v*"}])
          ' <<< "$DEPLOYMENT_POLICIES_JSON" > /dev/null || {
            echo "::error::production-release must contain exactly one custom deployment policy: the v* tag pattern."
            exit 1
          }

          echo "release_environment=production-release" >> "$GITHUB_OUTPUT"
          echo "Live tag and environment governance verified."

      - name: Checkout the exact tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Validate SemVer, master ancestry, and trusted pipeline
        id: trust
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          TAG_REF: ${{ github.ref }}
        run: |
          set -euo pipefail

          # SemVer 2.0.0: no leading zeroes in core or numeric prerelease
          # identifiers; build metadata is allowed and does not imply prerelease.
          readonly SEMVER_RE='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if ! [[ "$TAG_NAME" =~ $SEMVER_RE ]]; then
            echo "::error::Tag '$TAG_NAME' is not strict SemVer 2.0.0 (expected vMAJOR.MINOR.PATCH[-PRERELEASE][+BUILD])."
            exit 1
          fi

          [[ "$TAG_REF" == "refs/tags/${TAG_NAME}" ]] || {
            echo "::error::Release must run from an immutable tag ref."
            exit 1
          }

          TAG_NAME_URI="$(jq -rn --arg value "$TAG_NAME" '$value | @uri')"
          readonly TAG_NAME_URI
          TAG_OBJECT="$(git rev-parse "$TAG_REF")"
          TAG_COMMIT="$(git rev-parse "${TAG_REF}^{commit}")"
          readonly TAG_OBJECT TAG_COMMIT

          REMOTE_TAG_OBJECT="$(
            gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG_NAME_URI}" \
              --jq '.object.sha'
          )"
          readonly REMOTE_TAG_OBJECT
          if [[ "$REMOTE_TAG_OBJECT" != "$TAG_OBJECT" ]]; then
            echo "::error::Remote tag moved during validation (local=$TAG_OBJECT remote=$REMOTE_TAG_OBJECT)."
            exit 1
          fi

          git fetch --force --no-tags origin \
            'refs/heads/master:refs/remotes/origin/master'
          MASTER_SHA="$(git rev-parse refs/remotes/origin/master)"
          readonly MASTER_SHA

          if ! git merge-base --is-ancestor "$TAG_COMMIT" "$MASTER_SHA"; then
            echo "::error::Tag commit $TAG_COMMIT is not master or an ancestor of trusted master $MASTER_SHA."
            exit 1
          fi

          RUNS_JSON="$(
            gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/devsecops-pipeline.yaml/runs" \
              -f branch=master \
              -f event=push \
              -f head_sha="$TAG_COMMIT" \
              -f status=success \
              -f per_page=100
          )"
          readonly RUNS_JSON

          TRUSTED_RUN="$(
            jq -c --arg sha "$TAG_COMMIT" '
              [
                .workflow_runs[]
                | select(
                    .head_sha == $sha
                    and .head_branch == "master"
                    and .event == "push"
                    and .status == "completed"
                    and .conclusion == "success"
                    and .path == ".github/workflows/devsecops-pipeline.yaml"
                  )
              ]
              | sort_by(.updated_at)
              | last // empty
            ' <<< "$RUNS_JSON"
          )"
          readonly TRUSTED_RUN
          if [[ -z "$TRUSTED_RUN" ]]; then
            echo "::error::No successful DevSecOps Pipeline push run exists for master commit $TAG_COMMIT. Re-run this release only after that pipeline succeeds."
            exit 1
          fi

          TRUSTED_RUN_ID="$(jq -r '.id' <<< "$TRUSTED_RUN")"
          TRUSTED_RUN_URL="$(jq -r '.html_url' <<< "$TRUSTED_RUN")"
          readonly TRUSTED_RUN_ID TRUSTED_RUN_URL
          [[ "$TRUSTED_RUN_ID" =~ ^[0-9]+$ ]] || {
            echo "::error::Trusted workflow run returned an invalid run id."
            exit 1
          }

          readonly VERSION_WITHOUT_BUILD="${TAG_NAME%%+*}"
          if [[ "$VERSION_WITHOUT_BUILD" == *-* ]]; then
            IS_PRERELEASE=true
          else
            IS_PRERELEASE=false
          fi
          readonly IS_PRERELEASE

          {
            echo "is_prerelease=$IS_PRERELEASE"
            echo "master_sha=$MASTER_SHA"
            echo "tag_commit=$TAG_COMMIT"
            echo "tag_object=$TAG_OBJECT"
            echo "trusted_run_id=$TRUSTED_RUN_ID"
            echo "trusted_run_url=$TRUSTED_RUN_URL"
          } >> "$GITHUB_OUTPUT"

          echo "Trusted release source: $TAG_NAME -> $TAG_COMMIT (pipeline run $TRUSTED_RUN_ID)."

      - name: Download exact trusted-run CycloneDX SBOM
        env:
          GH_TOKEN: ${{ github.token }}
          TRUSTED_RUN_ID: ${{ steps.trust.outputs.trusted_run_id }}
        run: |
          set -euo pipefail
          [[ "$TRUSTED_RUN_ID" =~ ^[0-9]+$ ]]

          ARTIFACTS_JSON="$(
            gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${TRUSTED_RUN_ID}/artifacts" \
              -f per_page=100
          )"
          readonly ARTIFACTS_JSON
          jq -e '
            [.artifacts[] | select(.name == "sbom-cyclonedx" and .expired == false)]
            | length == 1
          ' <<< "$ARTIFACTS_JSON" > /dev/null || {
            echo "::error::Trusted run must expose exactly one unexpired sbom-cyclonedx artifact."
            exit 1
          }

          DOWNLOAD_DIR="$(mktemp -d "${RUNNER_TEMP}/trusted-sbom.XXXXXX")"
          readonly DOWNLOAD_DIR
          trap 'rm -rf "$DOWNLOAD_DIR"' EXIT
          gh run download "$TRUSTED_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name sbom-cyclonedx \
            --dir "$DOWNLOAD_DIR"

          EXPECTED_ENTRIES='trivy-sbom.json'
          ACTUAL_ENTRIES="$(find "$DOWNLOAD_DIR" -mindepth 1 -printf '%P\n' | sort)"
          readonly EXPECTED_ENTRIES ACTUAL_ENTRIES
          [[ "$ACTUAL_ENTRIES" == "$EXPECTED_ENTRIES" ]] || {
            echo "::error::Unexpected file set in trusted SBOM artifact."
            exit 1
          }
          [[ -f "${DOWNLOAD_DIR}/trivy-sbom.json" && ! -L "${DOWNLOAD_DIR}/trivy-sbom.json" ]]
          jq -e 'type == "object" and .bomFormat == "CycloneDX"' \
            "${DOWNLOAD_DIR}/trivy-sbom.json" > /dev/null || {
              echo "::error::Trusted run SBOM is not a valid CycloneDX JSON document."
              exit 1
            }

          mkdir -p release-dist
          mv -- "${DOWNLOAD_DIR}/trivy-sbom.json" release-dist/sbom.cdx.json

      - name: Install Cosign for promoted image verification
        uses: step-security/cosign-installer@7d5ca7d0ecba292387fa6f81cde2c05e53a2a6d7 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Resolve and verify the promoted image by digest
        id: image
        env:
          IMAGE_NAME: ${{ vars.IMAGE_NAME || secrets.IMAGE_NAME }}
          REGISTRY: ${{ vars.REGISTRY || secrets.REGISTRY }}
          REGISTRY_USERNAME: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
          TAG_COMMIT: ${{ steps.trust.outputs.tag_commit }}
          TRUSTED_RUN_ID: ${{ steps.trust.outputs.trusted_run_id }}
        run: |
          set -euo pipefail

          [[ -n "$REGISTRY" && -n "$REGISTRY_USERNAME" && -n "$IMAGE_NAME" ]] || {
            echo "::error::REGISTRY, DOCKERHUB_USERNAME, and IMAGE_NAME are required for a release."
            exit 1
          }
          case "$REGISTRY" in
            docker.io|index.docker.io|registry-1.docker.io) ;;
            *) echo "::error::Only the Docker Hub registry used by the trusted pipeline is supported."; exit 1 ;;
          esac
          [[ "$REGISTRY_USERNAME" =~ ^[a-z0-9][a-z0-9_-]*$ ]] \
            && [[ "$IMAGE_NAME" =~ ^[a-z0-9]+([._-][a-z0-9]+)*$ ]] || {
              echo "::error::Invalid Docker Hub repository coordinates."
              exit 1
            }

          readonly REPOSITORY_PATH="${REGISTRY_USERNAME}/${IMAGE_NAME}"
          readonly IMAGE_PATH="docker.io/${REPOSITORY_PATH}"
          readonly IMAGE_TAG="${IMAGE_PATH}:${TAG_COMMIT}"

          TOKEN_RESPONSE="$(
            curl -fsS --max-time 30 --get \
              'https://auth.docker.io/token' \
              --data-urlencode 'service=registry.docker.io' \
              --data-urlencode "scope=repository:${REPOSITORY_PATH}:pull"
          )" || {
            echo "::error::The promoted image is not publicly resolvable from Docker Hub."
            exit 1
          }
          TOKEN="$(jq -r '.token // empty' <<< "$TOKEN_RESPONSE")"
          readonly TOKEN
          [[ -n "$TOKEN" ]] || {
            echo "::error::Docker Hub returned no anonymous pull token."
            exit 1
          }

          EVIDENCE_DIR="$(mktemp -d "${RUNNER_TEMP}/release-image-evidence.XXXXXX")"
          readonly EVIDENCE_DIR
          trap 'rm -rf "$EVIDENCE_DIR"' EXIT
          readonly AUTH_CONFIG="${EVIDENCE_DIR}/auth.conf"
          readonly RESPONSE_HEADERS="${EVIDENCE_DIR}/headers"
          umask 077
          {
            printf 'header = "Authorization: Bearer %s"\n' "$TOKEN"
            echo 'header = "Accept: application/vnd.oci.image.index.v1+json"'
            echo 'header = "Accept: application/vnd.oci.image.manifest.v1+json"'
            echo 'header = "Accept: application/vnd.docker.distribution.manifest.list.v2+json"'
            echo 'header = "Accept: application/vnd.docker.distribution.manifest.v2+json"'
          } > "$AUTH_CONFIG"

          HTTP_CODE="$(
            curl -sS -D "$RESPONSE_HEADERS" -o /dev/null \
              -w '%{http_code}' --max-time 30 \
              --config "$AUTH_CONFIG" \
              "https://registry-1.docker.io/v2/${REPOSITORY_PATH}/manifests/${TAG_COMMIT}"
          )" || HTTP_CODE='000'
          [[ "$HTTP_CODE" == '200' ]] || {
            echo "::error::Promoted image tag $IMAGE_TAG is unavailable (HTTP $HTTP_CODE)."
            exit 1
          }

          IMAGE_DIGEST="$(
            awk 'tolower($1) == "docker-content-digest:" {gsub("\\r", "", $2); print $2}' \
              "$RESPONSE_HEADERS" | tail -n 1
          )"
          readonly IMAGE_DIGEST
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "::error::Docker Hub returned no valid immutable image digest."
            exit 1
          }
          readonly IMAGE_REF="${IMAGE_PATH}@${IMAGE_DIGEST}"

          cosign verify "$IMAGE_REF" \
            --certificate-identity "$EXPECTED_IMAGE_COSIGN_IDENTITY" \
            --certificate-oidc-issuer "$EXPECTED_COSIGN_ISSUER" \
            --certificate-github-workflow-trigger push \
            --certificate-github-workflow-sha "$TAG_COMMIT" \
            > "${EVIDENCE_DIR}/verified-signature.json"

          cosign verify-attestation --type cyclonedx \
            --certificate-identity "$EXPECTED_IMAGE_COSIGN_IDENTITY" \
            --certificate-oidc-issuer "$EXPECTED_COSIGN_ISSUER" \
            --certificate-github-workflow-trigger push \
            --certificate-github-workflow-sha "$TAG_COMMIT" \
            "$IMAGE_REF" > "${EVIDENCE_DIR}/verified-sbom-attestations.json"
          jq -e -s --slurpfile sbom release-dist/sbom.cdx.json '
            [
              .[]
              | if type == "array" then .[] else . end
              | .payload
              | @base64d
              | fromjson
              | select(.predicate == $sbom[0])
            ]
            | length > 0
          ' "${EVIDENCE_DIR}/verified-sbom-attestations.json" > /dev/null || {
            echo "::error::Image CycloneDX attestation does not match the exact trusted-run SBOM artifact."
            exit 1
          }

          cosign verify-attestation --type slsaprovenance \
            --certificate-identity "$EXPECTED_IMAGE_COSIGN_IDENTITY" \
            --certificate-oidc-issuer "$EXPECTED_COSIGN_ISSUER" \
            --certificate-github-workflow-trigger push \
            --certificate-github-workflow-sha "$TAG_COMMIT" \
            "$IMAGE_REF" > "${EVIDENCE_DIR}/verified-provenance-attestations.json"
          jq -e -s \
            --arg identity "$EXPECTED_IMAGE_COSIGN_IDENTITY" \
            --arg run_id "$TRUSTED_RUN_ID" \
            --arg sha "$TAG_COMMIT" '
              [
                .[]
                | if type == "array" then .[] else . end
                | .payload
                | @base64d
                | fromjson
                | select(.predicate.builder.id == $identity)
                | select(.predicate.invocation.configSource.entryPoint == ".github/workflows/devsecops-pipeline.yaml")
                | select(.predicate.invocation.configSource.digest.sha1 == $sha)
                | select(.predicate.invocation.environment.github_run_id == $run_id)
                | select(any(.predicate.materials[]?; .digest.sha1 == $sha))
              ]
              | length > 0
            ' "${EVIDENCE_DIR}/verified-provenance-attestations.json" > /dev/null || {
              echo "::error::Image provenance is not bound to the trusted workflow run and commit."
              exit 1
            }

          {
            echo "image_digest=$IMAGE_DIGEST"
            echo "image_ref=$IMAGE_REF"
            echo "image_tag=$IMAGE_TAG"
          } >> "$GITHUB_OUTPUT"
          echo "Promoted image signature, CycloneDX attestation, and provenance verified at $IMAGE_REF."

      - name: Package deterministic source deliverable and metadata
        id: package
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.image_digest }}
          IMAGE_REF: ${{ steps.image.outputs.image_ref }}
          IMAGE_TAG: ${{ steps.image.outputs.image_tag }}
          IS_PRERELEASE: ${{ steps.trust.outputs.is_prerelease }}
          MASTER_SHA: ${{ steps.trust.outputs.master_sha }}
          TAG_COMMIT: ${{ steps.trust.outputs.tag_commit }}
          TAG_NAME: ${{ github.ref_name }}
          TRUSTED_RUN_ID: ${{ steps.trust.outputs.trusted_run_id }}
          TRUSTED_RUN_URL: ${{ steps.trust.outputs.trusted_run_url }}
        run: |
          set -euo pipefail

          readonly REPOSITORY_NAME="${GITHUB_REPOSITORY#*/}"
          readonly VERSION="${TAG_NAME#v}"
          readonly ARCHIVE_NAME="${REPOSITORY_NAME}-${VERSION}.tar.gz"
          readonly ARCHIVE_PREFIX="${REPOSITORY_NAME}-${VERSION}/"

          # git archive contains every tracked file at the trusted commit. Refuse
          # sources it cannot make self-contained instead of silently shipping
          # submodule gitlinks or Git LFS pointer files.
          if git ls-tree -r "$TAG_COMMIT" \
            | awk '$1 == "160000" {found=1} END {exit(found ? 0 : 1)}'; then
            echo "::error::Source contains submodules; create a separate vendored release process."
            exit 1
          fi
          if git show "$TAG_COMMIT:.gitattributes" 2>/dev/null \
            | grep -Eq '(^|[[:space:]])filter=lfs([[:space:]]|$)'; then
            echo "::error::Source contains Git LFS objects; git archive would only package pointers."
            exit 1
          fi

          mkdir -p release-dist
          git archive --format=tar --prefix="$ARCHIVE_PREFIX" "$TAG_COMMIT" \
            | gzip -n -9 > "release-dist/${ARCHIVE_NAME}"
          test -s "release-dist/${ARCHIVE_NAME}"
          gzip -t "release-dist/${ARCHIVE_NAME}"

          jq -n \
            --arg archive "$ARCHIVE_NAME" \
            --arg expected_identity "$EXPECTED_COSIGN_IDENTITY" \
            --arg expected_image_identity "$EXPECTED_IMAGE_COSIGN_IDENTITY" \
            --arg generated_at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --arg image_digest "$IMAGE_DIGEST" \
            --arg image_ref "$IMAGE_REF" \
            --arg image_tag "$IMAGE_TAG" \
            --arg is_prerelease "$IS_PRERELEASE" \
            --arg master_sha "$MASTER_SHA" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg tag "$TAG_NAME" \
            --arg tag_commit "$TAG_COMMIT" \
            --arg trusted_run_id "$TRUSTED_RUN_ID" \
            --arg trusted_run_url "$TRUSTED_RUN_URL" \
            --arg workflow_run_id "$GITHUB_RUN_ID" \
            --arg workflow_run_attempt "$GITHUB_RUN_ATTEMPT" \
            '{
              schema_version: "1.0",
              generated_at: $generated_at,
              repository: $repository,
              release: {
                tag: $tag,
                prerelease: ($is_prerelease == "true"),
                source_archive: $archive,
                cyclonedx_sbom: "sbom.cdx.json"
              },
              source: {
                tag_commit: $tag_commit,
                master_at_validation: $master_sha
              },
              trusted_devsecops_run: {
                id: $trusted_run_id,
                url: $trusted_run_url,
                event: "push",
                branch: "master",
                conclusion: "success"
              },
              promoted_image: {
                tag: $image_tag,
                digest: $image_digest,
                immutable_ref: $image_ref,
                verification: {
                  signature: "verified",
                  cyclonedx_attestation: "verified-and-matched-to-sbom.cdx.json",
                  slsa_provenance: "verified-and-bound-to-trusted-run",
                  cosign_identity: $expected_image_identity
                }
              },
              governance: {
                tag_ruleset: "active-update-delete-protection-no-bypass-verified",
                release_environment: "production-release",
                deployment_tag_policy: "v*",
                wait_timer_minutes_minimum: 15,
                governance_mode: "solo-maintainer-with-mandatory-wait-timer",
                residual_risk: "no-independent-human-approval"
              },
              release_workflow: {
                run_id: $workflow_run_id,
                run_attempt: $workflow_run_attempt,
                expected_cosign_identity: $expected_identity,
                provenance_action: "actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6"
              }
            }' > release-dist/release-metadata.json
          jq -e . release-dist/release-metadata.json > /dev/null

          (
            cd release-dist
            # Hash only real deliverables. checksums.txt must never hash itself.
            sha256sum "$ARCHIVE_NAME" sbom.cdx.json release-metadata.json > checksums.txt
            sha256sum -c checksums.txt
          )

          CHECKSUMS_DIGEST="$(sha256sum release-dist/checksums.txt | awk '{print $1}')"
          readonly CHECKSUMS_DIGEST
          [[ "$CHECKSUMS_DIGEST" =~ ^[0-9a-f]{64}$ ]]

          {
            echo "archive_name=$ARCHIVE_NAME"
            echo "checksums_digest=$CHECKSUMS_DIGEST"
          } >> "$GITHUB_OUTPUT"

      - name: Upload validated release inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-input-${{ github.run_id }}
          path: |
            release-dist/${{ steps.package.outputs.archive_name }}
            release-dist/sbom.cdx.json
            release-dist/release-metadata.json
            release-dist/checksums.txt
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  attest_and_sign:
    name: 🔏 Attest and sign immutable inputs
    needs: [validate_and_package]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Harden the runner (deny-all egress)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            token.actions.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443

      - name: Download validated release inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-input-${{ github.run_id }}
          path: release-dist

      - name: Revalidate tag and trusted workflow run
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_COMMIT: ${{ needs.validate_and_package.outputs.tag_commit }}
          TAG_NAME: ${{ github.ref_name }}
          TAG_OBJECT: ${{ needs.validate_and_package.outputs.tag_object }}
          TRUSTED_RUN_ID: ${{ needs.validate_and_package.outputs.trusted_run_id }}
        run: |
          set -euo pipefail
          TAG_NAME_URI="$(jq -rn --arg value "$TAG_NAME" '$value | @uri')"
          readonly TAG_NAME_URI

          CURRENT_TAG_OBJECT="$(
            gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG_NAME_URI}" \
              --jq '.object.sha'
          )"
          [[ "$CURRENT_TAG_OBJECT" == "$TAG_OBJECT" ]] || {
            echo "::error::Release tag moved before signing."
            exit 1
          }

          COMPARE_JSON="$(
            gh api "repos/${GITHUB_REPOSITORY}/compare/${TAG_COMMIT}...master"
          )"
          COMPARE_STATUS="$(jq -r '.status' <<< "$COMPARE_JSON")"
          MERGE_BASE="$(jq -r '.merge_base_commit.sha' <<< "$COMPARE_JSON")"
          if [[ "$MERGE_BASE" != "$TAG_COMMIT" ]] \
            || [[ "$COMPARE_STATUS" != 'ahead' && "$COMPARE_STATUS" != 'identical' ]]; then
            echo "::error::Tag commit is no longer master or an ancestor of master."
            exit 1
          fi

          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${TRUSTED_RUN_ID}" \
            | jq -e --arg sha "$TAG_COMMIT" '
                .head_sha == $sha
                and .head_branch == "master"
                and .event == "push"
                and .status == "completed"
                and .conclusion == "success"
                and .path == ".github/workflows/devsecops-pipeline.yaml"
              ' > /dev/null

      - name: Verify artifact handoff
        env:
          ARCHIVE_NAME: ${{ needs.validate_and_package.outputs.archive_name }}
          EXPECTED_CHECKSUMS_DIGEST: ${{ needs.validate_and_package.outputs.checksums_digest }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_CHECKSUMS_DIGEST" =~ ^[0-9a-f]{64}$ ]]

          ACTUAL_CHECKSUMS_DIGEST="$(sha256sum release-dist/checksums.txt | awk '{print $1}')"
          [[ "$ACTUAL_CHECKSUMS_DIGEST" == "$EXPECTED_CHECKSUMS_DIGEST" ]] || {
            echo "::error::Checksums manifest changed during artifact handoff."
            exit 1
          }

          EXPECTED_FILES="$(
            printf '%s\n' \
              "$ARCHIVE_NAME" \
              checksums.txt \
              release-metadata.json \
              sbom.cdx.json \
              | sort
          )"
          ACTUAL_FILES="$(find release-dist -maxdepth 1 -type f -printf '%f\n' | sort)"
          [[ "$ACTUAL_FILES" == "$EXPECTED_FILES" ]] || {
            echo "::error::Unexpected file set in release input artifact."
            diff -u <(printf '%s\n' "$EXPECTED_FILES") <(printf '%s\n' "$ACTUAL_FILES") || true
            exit 1
          }

          (cd release-dist && sha256sum -c checksums.txt)

      - name: Install Cosign
        uses: step-security/cosign-installer@7d5ca7d0ecba292387fa6f81cde2c05e53a2a6d7 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Generate GitHub SLSA build provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: release-dist/checksums.txt
          show-summary: true

      - name: Self-verify and preserve provenance bundle
        env:
          ARCHIVE_NAME: ${{ needs.validate_and_package.outputs.archive_name }}
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
          GH_TOKEN: ${{ github.token }}
          TAG_COMMIT: ${{ needs.validate_and_package.outputs.tag_commit }}
        run: |
          set -euo pipefail
          [[ -s "$BUNDLE_PATH" ]] || {
            echo "::error::GitHub provenance action returned no bundle."
            exit 1
          }

          for subject in "$ARCHIVE_NAME" release-metadata.json sbom.cdx.json; do
            gh attestation verify "release-dist/${subject}" \
              --repo "$GITHUB_REPOSITORY" \
              --bundle "$BUNDLE_PATH" \
              --cert-identity "$EXPECTED_COSIGN_IDENTITY" \
              --source-ref "$GITHUB_REF" \
              --source-digest "$TAG_COMMIT" \
              --deny-self-hosted-runners > /dev/null
          done

          cp -- "$BUNDLE_PATH" release-dist/provenance.intoto.jsonl

      - name: Sign and self-verify checksums with exact OIDC identity
        env:
          TAG_COMMIT: ${{ needs.validate_and_package.outputs.tag_commit }}
        run: |
          set -euo pipefail
          cd release-dist
          sha256sum -c checksums.txt

          cosign sign-blob --yes \
            --output-signature checksums.txt.sig \
            --output-certificate checksums.txt.pem \
            checksums.txt

          cosign verify-blob \
            --certificate checksums.txt.pem \
            --signature checksums.txt.sig \
            --certificate-identity "$EXPECTED_COSIGN_IDENTITY" \
            --certificate-oidc-issuer "$EXPECTED_COSIGN_ISSUER" \
            --certificate-github-workflow-trigger push \
            --certificate-github-workflow-sha "$TAG_COMMIT" \
            checksums.txt > /dev/null

      - name: Upload signed release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-signed-${{ github.run_id }}
          path: |
            release-dist/${{ needs.validate_and_package.outputs.archive_name }}
            release-dist/sbom.cdx.json
            release-dist/release-metadata.json
            release-dist/checksums.txt
            release-dist/checksums.txt.sig
            release-dist/checksums.txt.pem
            release-dist/provenance.intoto.jsonl
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish_release:
    name: 🚀 Publish protected GitHub Release
    needs: [validate_and_package, attest_and_sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: ${{ needs.validate_and_package.outputs.release_environment }}
    permissions:
      actions: read
      attestations: read
      contents: write
      deployments: read
    steps:
      - name: Harden the runner (deny-all egress)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            uploads.github.com:443
            uploads.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            rekor.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443

      - name: Download signed release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-signed-${{ github.run_id }}
          path: release-dist

      - name: Install Cosign for independent verification
        uses: step-security/cosign-installer@7d5ca7d0ecba292387fa6f81cde2c05e53a2a6d7 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Revalidate trust and reject an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_COMMIT: ${{ needs.validate_and_package.outputs.tag_commit }}
          TAG_NAME: ${{ github.ref_name }}
          TAG_OBJECT: ${{ needs.validate_and_package.outputs.tag_object }}
          TRUSTED_RUN_ID: ${{ needs.validate_and_package.outputs.trusted_run_id }}
        run: |
          set -euo pipefail

          if ! RULESETS_JSON="$(
            gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/rulesets" \
              -f includes_parents=true \
              -f per_page=100
          )"; then
            echo "::error::Cannot revalidate repository rulesets before publication."
            exit 1
          fi

          TAG_RULESET_VALID=false
          while IFS= read -r ruleset_id; do
            [[ "$ruleset_id" =~ ^[0-9]+$ ]] || continue
            RULESET_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/rulesets/${ruleset_id}")" || {
              echo "::error::Cannot inspect tag ruleset ${ruleset_id}."
              exit 1
            }

            if jq -e '
              .target == "tag"
              and .enforcement == "active"
              and .conditions.ref_name.include == ["refs/tags/v*"]
              and .conditions.ref_name.exclude == []
              and ([.rules[].type] | index("deletion") != null)
              and ([.rules[].type] | index("update") != null)
              and ([.rules[].type] | index("creation") == null)
              and ((.bypass_actors // []) | length == 0)
            ' <<< "$RULESET_JSON" > /dev/null; then
              TAG_RULESET_VALID=true
              break
            fi
          done < <(
            jq -r '.[] | select(.target == "tag" and .enforcement == "active") | .id' \
              <<< "$RULESETS_JSON"
          )
          [[ "$TAG_RULESET_VALID" == 'true' ]] || {
            echo "::error::Release tag governance changed after validation."
            exit 1
          }

          ENVIRONMENT_JSON="$(
            gh api "repos/${GITHUB_REPOSITORY}/environments/production-release"
          )" || {
            echo "::error::production-release cannot be revalidated after the wait timer."
            exit 1
          }
          jq -e '
            any(
              .protection_rules[]?;
              .type == "wait_timer"
              and (.wait_timer | type == "number")
              and .wait_timer >= 15
            )
            and ([
              .protection_rules[]? | select(.type == "required_reviewers")
            ] | length == 0)
            and .deployment_branch_policy.protected_branches == false
            and .deployment_branch_policy.custom_branch_policies == true
          ' <<< "$ENVIRONMENT_JSON" > /dev/null || {
            echo "::error::production-release wait-timer, reviewer, or custom deployment-policy governance changed after validation."
            exit 1
          }

          DEPLOYMENT_POLICIES_JSON="$(
            gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/environments/production-release/deployment-branch-policies" \
              -f per_page=100
          )" || {
            echo "::error::Cannot revalidate production-release deployment tag policies."
            exit 1
          }
          jq -e '
            ([.branch_policies[]? | {type, name}]
              == [{type: "tag", name: "v*"}])
          ' <<< "$DEPLOYMENT_POLICIES_JSON" > /dev/null || {
            echo "::error::production-release v* deployment tag policy changed after validation."
            exit 1
          }

          TAG_NAME_URI="$(jq -rn --arg value "$TAG_NAME" '$value | @uri')"
          readonly TAG_NAME_URI

          CURRENT_TAG_OBJECT="$(
            gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG_NAME_URI}" \
              --jq '.object.sha'
          )"
          [[ "$CURRENT_TAG_OBJECT" == "$TAG_OBJECT" ]] || {
            echo "::error::Release tag moved while awaiting the environment wait timer."
            exit 1
          }

          COMPARE_JSON="$(
            gh api "repos/${GITHUB_REPOSITORY}/compare/${TAG_COMMIT}...master"
          )"
          [[ "$(jq -r '.merge_base_commit.sha' <<< "$COMPARE_JSON")" == "$TAG_COMMIT" ]]
          case "$(jq -r '.status' <<< "$COMPARE_JSON")" in
            ahead|identical) ;;
            *) echo "::error::Tag commit is no longer trusted by master."; exit 1 ;;
          esac

          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${TRUSTED_RUN_ID}" \
            | jq -e --arg sha "$TAG_COMMIT" '
                .head_sha == $sha
                and .head_branch == "master"
                and .event == "push"
                and .status == "completed"
                and .conclusion == "success"
                and .path == ".github/workflows/devsecops-pipeline.yaml"
              ' > /dev/null

          if gh release view "$TAG_NAME" > /dev/null 2>&1; then
            echo "::error::Release '$TAG_NAME' already exists. Releases are immutable; use a new SemVer tag."
            exit 1
          fi

      - name: Verify signed release bundle independently
        env:
          ARCHIVE_NAME: ${{ needs.validate_and_package.outputs.archive_name }}
          EXPECTED_CHECKSUMS_DIGEST: ${{ needs.validate_and_package.outputs.checksums_digest }}
          GH_TOKEN: ${{ github.token }}
          TAG_COMMIT: ${{ needs.validate_and_package.outputs.tag_commit }}
        run: |
          set -euo pipefail

          EXPECTED_FILES="$(
            printf '%s\n' \
              "$ARCHIVE_NAME" \
              checksums.txt \
              checksums.txt.pem \
              checksums.txt.sig \
              provenance.intoto.jsonl \
              release-metadata.json \
              sbom.cdx.json \
              | sort
          )"
          ACTUAL_FILES="$(find release-dist -maxdepth 1 -type f -printf '%f\n' | sort)"
          [[ "$ACTUAL_FILES" == "$EXPECTED_FILES" ]] || {
            echo "::error::Unexpected file set in signed release bundle."
            diff -u <(printf '%s\n' "$EXPECTED_FILES") <(printf '%s\n' "$ACTUAL_FILES") || true
            exit 1
          }

          ACTUAL_CHECKSUMS_DIGEST="$(sha256sum release-dist/checksums.txt | awk '{print $1}')"
          [[ "$ACTUAL_CHECKSUMS_DIGEST" == "$EXPECTED_CHECKSUMS_DIGEST" ]] || {
            echo "::error::Signed checksum manifest changed during handoff."
            exit 1
          }

          (
            cd release-dist
            sha256sum -c checksums.txt
            cosign verify-blob \
              --certificate checksums.txt.pem \
              --signature checksums.txt.sig \
              --certificate-identity "$EXPECTED_COSIGN_IDENTITY" \
              --certificate-oidc-issuer "$EXPECTED_COSIGN_ISSUER" \
              --certificate-github-workflow-trigger push \
              --certificate-github-workflow-sha "$TAG_COMMIT" \
              checksums.txt > /dev/null
          )

          for subject in "$ARCHIVE_NAME" release-metadata.json sbom.cdx.json; do
            gh attestation verify "release-dist/${subject}" \
              --repo "$GITHUB_REPOSITORY" \
              --bundle release-dist/provenance.intoto.jsonl \
              --cert-identity "$EXPECTED_COSIGN_IDENTITY" \
              --source-ref "$GITHUB_REF" \
              --source-digest "$TAG_COMMIT" \
              --deny-self-hosted-runners > /dev/null
          done

      - name: Create verified draft release
        id: draft_release
        uses: step-security/action-gh-release@44319d37c8b7966bf07f89f0cbf63408141446df # v3.0.3
        with:
          token: ${{ github.token }}
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: true
          prerelease: ${{ needs.validate_and_package.outputs.is_prerelease }}
          overwrite_files: false
          preserve_order: true
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            release-dist/${{ needs.validate_and_package.outputs.archive_name }}
            release-dist/sbom.cdx.json
            release-dist/release-metadata.json
            release-dist/checksums.txt
            release-dist/checksums.txt.sig
            release-dist/checksums.txt.pem
            release-dist/provenance.intoto.jsonl
          body: |
            ## 🛡️ Verified release

            - **Source commit:** `${{ needs.validate_and_package.outputs.tag_commit }}`
            - **Trusted DevSecOps run:** ${{ needs.validate_and_package.outputs.trusted_run_url }}
            - **Promoted image tag:** `${{ needs.validate_and_package.outputs.image_tag }}`
            - **Promoted image digest:** `${{ needs.validate_and_package.outputs.image_digest }}`
            - **Immutable image:** `${{ needs.validate_and_package.outputs.image_ref }}`
            - **Image evidence:** exact DevSecOps workflow signature, matching CycloneDX attestation, and trusted-run-bound SLSA provenance verified before signing this release.

            Verify the real source deliverables:

            ```bash
            sha256sum -c checksums.txt
            cosign verify-blob \
              --certificate checksums.txt.pem \
              --signature checksums.txt.sig \
              --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              checksums.txt
            gh attestation verify "${{ needs.validate_and_package.outputs.archive_name }}" \
              --repo "${{ github.repository }}" \
              --bundle provenance.intoto.jsonl \
              --cert-identity "https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}"
            ```

      - name: Verify draft assets and publish atomically
        id: publish
        env:
          ARCHIVE_NAME: ${{ needs.validate_and_package.outputs.archive_name }}
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          TAG_OBJECT: ${{ needs.validate_and_package.outputs.tag_object }}
        run: |
          set -euo pipefail

          RELEASE_JSON="$(
            gh release view "$TAG_NAME" \
              --json assets,databaseId,isDraft,url
          )"
          readonly RELEASE_JSON
          [[ "$(jq -r '.isDraft' <<< "$RELEASE_JSON")" == 'true' ]] || {
            echo "::error::Release was not created as a draft."
            exit 1
          }

          EXPECTED_ASSETS="$(
            printf '%s\n' \
              "$ARCHIVE_NAME" \
              checksums.txt \
              checksums.txt.pem \
              checksums.txt.sig \
              provenance.intoto.jsonl \
              release-metadata.json \
              sbom.cdx.json \
              | sort
          )"
          ACTUAL_ASSETS="$(jq -r '.assets[].name' <<< "$RELEASE_JSON" | sort)"
          [[ "$ACTUAL_ASSETS" == "$EXPECTED_ASSETS" ]] || {
            echo "::error::Draft release asset set is incomplete or unexpected."
            exit 1
          }
          jq -e 'all(.assets[]; .size > 0)' <<< "$RELEASE_JSON" > /dev/null

          # Close the release-gate-to-publish race: the exact tag object must still
          # match immediately before the draft becomes public.
          TAG_NAME_URI="$(jq -rn --arg value "$TAG_NAME" '$value | @uri')"
          readonly TAG_NAME_URI
          CURRENT_TAG_OBJECT="$(
            gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG_NAME_URI}" \
              --jq '.object.sha'
          )"
          [[ "$CURRENT_TAG_OBJECT" == "$TAG_OBJECT" ]] || {
            echo "::error::Release tag moved before draft publication."
            exit 1
          }

          RELEASE_ID="$(jq -r '.databaseId' <<< "$RELEASE_JSON")"
          [[ "$RELEASE_ID" =~ ^[0-9]+$ ]]
          PUBLISHED_JSON="$(
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
              -F draft=false
          )"
          readonly PUBLISHED_JSON
          [[ "$(jq -r '.draft' <<< "$PUBLISHED_JSON")" == 'false' ]]
          RELEASE_URL="$(jq -r '.html_url' <<< "$PUBLISHED_JSON")"
          readonly RELEASE_URL

          {
            echo "## 🚀 Production Release Published"
            echo "- **Release:** ${RELEASE_URL}"
            echo "- **Source commit:** ${{ needs.validate_and_package.outputs.tag_commit }}"
            echo "- **Trusted pipeline:** ${{ needs.validate_and_package.outputs.trusted_run_url }}"
            echo "- **Checksums manifest SHA-256:** ${{ needs.validate_and_package.outputs.checksums_digest }}"
            echo "- **Verified image:** ${{ needs.validate_and_package.outputs.image_ref }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Roll back an unpublished draft on failure
        if: ${{ always() && steps.draft_release.outcome != 'skipped' && steps.publish.outcome != 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! RELEASE_STATE="$(
            gh release view "$TAG_NAME" --json isDraft --jq '.isDraft' 2>/dev/null
          )"; then
            echo "No draft release exists; no rollback was required."
          elif [[ "$RELEASE_STATE" == 'true' ]]; then
            gh release delete "$TAG_NAME" --yes
            echo "Removed the unpublished draft release; the protected source tag was retained."
          else
            echo "::error::Refusing cleanup because '$TAG_NAME' is not a draft release."
            exit 1
          fi
