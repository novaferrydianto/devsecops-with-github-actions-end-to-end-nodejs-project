name: 🚀 Production Release & Signing

on:
  push:
    tags:
      - 'v*' # Trigger saat tag v1.0.0, v2.1.0, dll didorong

# ✅ PoLP Permissions (Hanya baca di level global)
permissions:
  contents: read

jobs:
  build_and_release:
    name: 🏗️ Build & Signed Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # Untuk membuat GitHub Release & mengunggah aset
      id-token: write # Untuk otentikasi Sigstore/Cosign ke Fulcio
    steps:
      # =============================
      # 1) SETUP & CHECKOUT
      # =============================
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            fulcio.sigstore.dev:443
            github.com:443
            objects.githubusercontent.com:443
            rekor.sigstore.dev:443
            token.actions.githubusercontent.com:443
            tuf-repo-cdn.sigstore.dev:443
            uploads.githubusercontent.com:443

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Cosign
        uses: step-security/cosign-installer@7d5ca7d0ecba292387fa6f81cde2c05e53a2a6d7 # v4.1.2

      # =============================
      # 2) GENERATE ARTIFACTS
      # =============================
      - name: Generate Checksums
        run: |
          echo "### 📄 Generating SHA256 Checksums..."
          # Menghitung hash untuk file-file utama di root
          find . -maxdepth 1 -type f -not -path '*/.*' -exec sha256sum {} + > checksums.txt
          echo "Generated checksums.txt:"
          cat checksums.txt

      # =============================
      # 3) SIGNING (KEYLESS)
      # =============================
      - name: Sign Checksums with Cosign
        run: |
          echo "### 🔏 Signing checksums.txt using OIDC identity..."
          # Menggunakan GitHub Actions OIDC (tanpa perlu menyimpan private key di secrets)
          cosign sign-blob --yes \
            --output-signature checksums.txt.sig \
            --output-certificate checksums.txt.pem \
            checksums.txt

      # =============================
      # 4) CREATE GITHUB RELEASE
      # =============================
      - name: Create GitHub Release
        uses: step-security/action-gh-release@d2093dbdaf0c6507874908247e14bbc4dee6a72d # v3.0.1
        with:
          files: |
            checksums.txt
            checksums.txt.sig
            checksums.txt.pem
          body: |
            ## 🛡️ Rilis Terverifikasi
            Rilis ini telah ditandatangani secara kriptografis menggunakan **Sigstore/Cosign**.
            
            ### Cara Verifikasi:
            1. Unduh `checksums.txt`, `checksums.txt.sig`, dan `checksums.txt.pem`.
            2. Jalankan perintah:
               ```bash
               cosign verify-blob \
                 --certificate checksums.txt.pem \
                 --signature checksums.txt.sig \
                 checksums.txt \
                 --certificate-identity-regexp "https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/tags/v*" \
                 --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
               ```
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
