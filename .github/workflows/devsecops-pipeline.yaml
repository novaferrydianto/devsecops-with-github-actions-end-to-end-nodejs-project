# =====================================================================
# DevSecOps Pipeline — Hardened Rewrite
# ---------------------------------------------------------------------
# Artifact continuity and signed evidence enforced end-to-end:
#   single build  ->  scan (fail-closed)  ->  DAST
#                 ->  stage BY DIGEST  ->  cosign sign + verify
#                 ->  SBOM attest + verify  ->  promote full-SHA tag
#
# Key changes vs. previous version:
#   * SCAN == SHIP: image is built EXACTLY ONCE, passed between jobs as a
#     tar artifact (docker save/load). No more "build A, scan A, ship B".
#   * Sign & verify by IMMUTABLE DIGEST (not the mutable :tag).
#   * Cosign migrated to KEYLESS / OIDC (id-token: write) — no private key
#     on the runner filesystem, no key rotation burden.
#   * SBOM is now PERSISTED (artifact) AND ATTESTED to the image digest.
#   * Security gates are FAIL-CLOSED (exit 1), not fail-open (exit 0).
#   * DAST reuses the exact scanned image (no 3rd rebuild) and resolves the
#     bridge gateway dynamically instead of hardcoding 172.17.0.1.
#   * Sonar migrated: sonarcloud-github-action (archived Oct-2025) ->
#     sonarqube-scan-action (+ SONAR_HOST_URL).
#   * Final summary is DYNAMIC and an enforcing aggregate gate.
#
# NOTE on pinning: every third-party action is pinned to a full commit SHA
# (the trailing comment records the human-readable version). SHAs were verified
# against each project's official GitHub Releases page. To keep these pins fresh
# and auditable over time, enable Dependabot for the "github-actions" ecosystem
# (.github/dependabot.yml) — it bumps the SHA + version comment via PRs.
# =====================================================================

name: DevSecOps Pipeline
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# ✅ Global Config
env:
  NODE_VERSION: 24
  # Single, canonical local tag reused by every job via the image artifact.
  LOCAL_IMAGE: local/app:${{ github.sha }}

defaults:
  run:
    shell: bash

jobs:
  # =================================================================
  # STAGE 1: TESTS + SECURITY AUDIT
  # Runs in parallel. Secret-backed scanners (Sonar, Snyk) run on every ref that
  # can read Actions secrets — same-repo PRs included, so they gate pre-merge —
  # and are skipped for fork PRs and Dependabot.
  # =================================================================
  test_and_sast:
    runs-on: ubuntu-24.04
    name: 🧱 Test & Quality
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      sonar_gate: ${{ steps.sonar.outcome }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Sonar needs full history for blame/relevancy
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install & Test
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run cover

      - name: SonarQube Cloud Scan
        id: sonar
        # MIGRATED: sonarcloud-github-action was archived/deprecated (Oct 2025).
        # sonarqube-scan-action is the drop-in replacement and now requires SONAR_HOST_URL.
        #
        # Trust boundary: secrets are withheld from fork PRs, so gate on the FORK
        # (not on the ref). Same-repo PRs do have secrets and must be scanned
        # pre-merge — gating on `github.ref == 'refs/heads/master'` would never
        # match a PR (its ref is refs/pull/N/merge) and would push the quality
        # gate to post-merge, too late to block anything.
        if: >-
          github.actor != 'dependabot[bot]' &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.organization=devsecopsganodejs
            -Dsonar.projectKey=devsecopsganodejs
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.scanner.skipJreProvisioning=true
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

  security_audit:
    runs-on: ubuntu-24.04
    name: 🧩 SCA, License & FS Audit
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      snyk_gate: ${{ steps.snyk_gate.outcome }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install report tooling
        run: npm ci --ignore-scripts

      # The audit gates below are INDEPENDENT of each other, so each carries
      # `!cancelled()`: one failing gate must not mask the findings of the rest.
      # A single run should surface every problem, not just the first one.
      - name: Audit dependency vulnerabilities (npm audit)
        run: npm audit --audit-level=high

      - name: Verify dependency license inventory
        if: ${{ !cancelled() }}
        run: npm run licenses

      - name: Gitleaks Secret Scan
        if: ${{ !cancelled() }}
        uses: step-security/gitleaks-action@678c692fa015502757d021ac74f2a42604bf2048 # v2.4.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Snyk Scan (skipped when Actions secrets are unavailable)
        id: snyk
        if: >-
          !cancelled() &&
          github.actor != 'dependabot[bot]' &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        uses: snyk/actions/node@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
        continue-on-error: true # we capture the report; the gate step below decides pass/fail
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test
          args: --dev --severity-threshold=low --json-file-output=snyk-report.json

      - name: Generate Snyk HTML Report
        # Must mirror the Snyk step's condition exactly: if Snyk ran, this runs.
        if: >-
          !cancelled() &&
          github.actor != 'dependabot[bot]' &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          ./node_modules/.bin/snyk-to-html -i snyk-report.json -o snyk-report.html || true

      - name: Enforce Security & License Policy (FAIL-CLOSED)
        id: snyk_gate
        # Must mirror the Snyk step's condition exactly. If they ever diverge and
        # this gate runs while Snyk was skipped, SNYK_OUTCOME is 'skipped' and the
        # case statement below fails closed — the safe direction.
        if: >-
          !cancelled() &&
          github.actor != 'dependabot[bot]' &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        env:
          SNYK_OUTCOME: ${{ steps.snyk.outcome }}
        run: |
          set -euo pipefail

          readonly REPORT='snyk-report.json'
          readonly ALLOWED_JSON='["MIT","Apache-2.0","BSD-2-Clause","BSD-3-Clause","ISC","BlueOak-1.0.0","Python-2.0"]'

          case "$SNYK_OUTCOME" in
            success|failure) ;;
            *)
              echo "::error::Snyk did not complete normally (outcome=$SNYK_OUTCOME)."
              exit 1
              ;;
          esac

          if [[ ! -s "$REPORT" ]]; then
            echo "::error::Snyk report is missing or empty."
            exit 1
          fi

          if ! jq -e '
            def valid_result:
              type == "object"
              and (.ok | type == "boolean")
              and (.vulnerabilities | type == "array")
              and (has("error") | not);

            if type == "array" then
              length > 0 and all(.[]; valid_result)
            else
              valid_result
            end
          ' "$REPORT" > /dev/null; then
            echo "::error::Snyk returned malformed or scanner-error JSON."
            exit 1
          fi

          TOTAL_ISSUE_COUNT="$(
            jq '[
              (if type == "array" then .[] else . end)
              | .vulnerabilities[]?
            ] | length' "$REPORT"
          )"

          if [[ "$SNYK_OUTCOME" == "failure" && "$TOTAL_ISSUE_COUNT" -eq 0 ]]; then
            echo "::error::Snyk failed without producing actionable issue data."
            exit 1
          fi

          VULN_COUNT="$(
            jq '[
              (if type == "array" then .[] else . end)
              | .vulnerabilities[]?
              | select((.type // "vuln") != "license")
              | select(.severity == "high" or .severity == "critical")
            ] | length' "$REPORT"
          )"

          ILLEGAL_LICENSES="$(
            jq -r --argjson allowed "$ALLOWED_JSON" '
              def results:
                if type == "array" then .[] else . end;

              def is_license:
                ((.type // "") == "license")
                or ((.id // "") | startswith("snyk:lic:"));

              def license_name:
                if ((.id // "") | startswith("snyk:lic:")) then
                  (.id | split(":") | .[-1])
                elif (.license // null) != null then
                  (.license | tostring)
                else
                  ((.title // "") | split(" ")[0])
                end;

              [
                results
                | .vulnerabilities[]?
                | select(is_license)
                | license_name
                | select(length > 0)
              ]
              | unique
              | map(
                  select(
                    . as $license
                    | ($allowed | index($license)) == null
                  )
                )
              | join(", ")
            ' "$REPORT"
          )"

          if [[ "$VULN_COUNT" -ne 0 ]]; then
            echo "::error::Critical/High vulnerabilities found: $VULN_COUNT"
            exit 1
          fi

          if [[ -n "$ILLEGAL_LICENSES" ]]; then
            echo "::error::Disallowed licenses found: $ILLEGAL_LICENSES"
            exit 1
          fi

          echo "Snyk vulnerability and emitted-license policy passed."

      - name: Trivy FS Scan (ENFORCING)
        # Was report-only before. Now gates on fixable CRITICAL/HIGH.
        # Relax to `exit-code: 0` (report-only) if this proves too strict for your repo.
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # trivy-action v0.36.0 defaults to Trivy CLI v0.70.0; pin the scanner itself
          # to the current release so vuln/DB coverage doesn't silently lag.
          version: v0.72.0
          scan-type: fs
          scan-ref: .
          format: table
          output: trivy-fs-report.txt
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1

      - name: Upload Security Artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: security-reports
          path: |
            snyk-report.*
            trivy-fs-report.txt
          if-no-files-found: warn
          retention-days: 14

  # =================================================================
  # STAGE 2: BUILD ONCE + IMAGE SCAN (fail-closed) + SBOM
  # The image is built a SINGLE time here and shipped to downstream jobs
  # as a tar artifact, so what gets signed/DAST-tested is byte-identical
  # to what was scanned.
  # =================================================================
  build_scan:
    needs: [test_and_sast, security_audit]
    runs-on: ubuntu-24.04
    name: 🧪 Build (once) & Image Scan
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: step-security/setup-buildx-action@6997872a55d77391e51b87609556578131f44402 # v4.1.0

      - name: Build image ONCE (load into local daemon)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: ${{ env.LOCAL_IMAGE }}
          # Local docker save/load continuity is used here; OCI provenance is
          # intentionally not claimed by this workflow.
          provenance: false

      # --- Informational SARIF for the Security tab (never blocks) ---
      - name: Trivy Image Scan (SARIF — informational)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        continue-on-error: true
        with:
          version: v0.72.0
          scan-type: image
          image-ref: ${{ env.LOCAL_IMAGE }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH

      - name: Upload SARIF to Security Tab
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        if: >-
          hashFiles('trivy-results.sarif') != '' &&
          github.actor != 'dependabot[bot]' &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image

      # --- ENFORCING gate: this is the one that actually blocks the build ---
      - name: Trivy Image Scan (ENFORCING gate — fail-closed)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.72.0
          scan-type: image
          image-ref: ${{ env.LOCAL_IMAGE }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true # don't block on CVEs with no available fix; remove to be stricter
          exit-code: 1

      # Steps below only run if the gate above passed -> we only ever
      # persist / SBOM / ship images that cleared the gate.
      - name: Generate SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.72.0
          scan-type: image
          image-ref: ${{ env.LOCAL_IMAGE }}
          format: cyclonedx
          output: trivy-sbom.json

      - name: Save the built image (single-build artifact continuity)
        run: |
          set -euo pipefail
          docker save "${{ env.LOCAL_IMAGE }}" -o image.tar
          ls -lh image.tar

      - name: Upload image artifact (consumed by deliver/DAST without rebuild)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: app-image
          path: image.tar
          if-no-files-found: error
          retention-days: 3

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom-cyclonedx
          path: trivy-sbom.json
          if-no-files-found: error
          retention-days: 7

  # =================================================================
  # STAGE 4: DELIVERY & SIGNING  (master push only; waits for DAST below)
  # Loads the EXACT scanned image, stages it, then signs/verifies and attests
  # its resolved digest before promoting a full-SHA tag. Keyless (OIDC).
  # =================================================================
  deliver_sign:
    needs: [build_scan, dast_zap_ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    name: 📦🔏 Stage, Sign, Verify & Promote
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # keyless cosign via GitHub OIDC
    env:
      REGISTRY: ${{ vars.REGISTRY || secrets.REGISTRY }}
      IMAGE_NAME: ${{ vars.IMAGE_NAME || secrets.IMAGE_NAME }}
      REGISTRY_USERNAME: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
      EXPECTED_COSIGN_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/devsecops-pipeline.yaml@refs/heads/master
      EXPECTED_COSIGN_ISSUER: https://token.actions.githubusercontent.com
    steps:
      - name: Harden the runner (BLOCK — allowlisted egress only)
        # This is the only job holding BOTH the OIDC signing identity and the
        # registry push credential, so it runs fail-closed on egress instead of
        # `audit`. Anything not listed below cannot be reached, materially
        # reducing the exfiltration surface. Allowed services remain inside the
        # credential's blast radius, so keep the list minimal and review it.
        #
        # If a step ever fails on a blocked endpoint, do NOT widen this blindly:
        # open the run's StepSecurity insights link, confirm the destination is
        # expected, then add it. Missing entries fail the deploy — the safe
        # direction, but it does block delivery until corrected.
        #
        # Why each entry is here (comments cannot live inside the `>` block,
        # since a folded scalar would treat them as literal endpoint text):
        #   *.actions.githubusercontent.com — the OIDC token is requested from
        #     ACTIONS_ID_TOKEN_REQUEST_URL, a per-run pipelinesghubeus* host.
        #     token.actions.githubusercontent.com is only the `iss` claim /
        #     JWKS origin, NOT where the runner fetches the token. This wildcard
        #     also covers the artifact results-receiver host.
        #   raw.githubusercontent.com — cosign-installer bootstraps v3.0.6 and
        #     we request v2.6.4, so it downloads the desired binary and verifies
        #     it against .../sigstore/cosign/<ver>/release/release-cosign.pub.
        #   production.cloudfront.docker.com — Docker Hub's AWS CloudFront blob
        #     CDN, alongside the older Cloudflare host. Both must be reachable.
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            raw.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            auth.docker.io:443
            index.docker.io:443
            registry-1.docker.io:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
            hub.docker.com:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443

      - name: Download built image (no rebuild)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: app-image

      - name: Download SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom-cyclonedx

      - name: Load image into local daemon
        run: docker load -i image.tar

      - name: Validate delivery configuration
        run: |
          set -euo pipefail
          [[ -n "$REGISTRY" ]] || { echo "::error::REGISTRY is not configured"; exit 1; }
          [[ -n "$IMAGE_NAME" ]] || { echo "::error::IMAGE_NAME is not configured"; exit 1; }
          [[ -n "$REGISTRY_USERNAME" ]] || { echo "::error::DOCKERHUB_USERNAME is not configured"; exit 1; }
          docker buildx version > /dev/null \
            || { echo "::error::Docker Buildx is required for digest-preserving promotion."; exit 1; }

          # This job only supports Docker Hub end-to-end: the credential is a
          # Docker Hub PAT, the egress allowlist names Docker Hub hosts, and the
          # staging-tag cleanup speaks the Docker Hub API. Pointing REGISTRY at
          # (say) GHCR would get blocked at login/push with a confusing egress
          # error and would leave the staging tag behind, so reject it here —
          # before anything is pushed — instead of failing halfway through.
          case "$REGISTRY" in
            docker.io|index.docker.io|registry-1.docker.io) ;;
            *)
              echo "::error::Unsupported REGISTRY '$REGISTRY'. This pipeline supports Docker Hub only (docker.io, index.docker.io, registry-1.docker.io). Adding another registry means updating the credential, the harden-runner allowed-endpoints list, and the staging-tag cleanup together."
              exit 1
              ;;
          esac

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # Pin the Cosign binary (Dependabot won't bump this input — review periodically).
          cosign-release: 'v2.6.4'

      # Install every third-party tool before exposing the registry credential.
      - name: Login to Registry
        uses: step-security/docker-login-action@164e21d7e52229904128e2f946001cb88278c33d # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push non-release staging tag and capture digest
        id: stage
        run: |
          set -euo pipefail
          readonly IMAGE_PATH="${REGISTRY}/${REGISTRY_USERNAME}/${IMAGE_NAME}"
          readonly FINAL_TAG="$GITHUB_SHA"
          readonly STAGING_TAG="staging-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          # Record the staging coordinates BEFORE the push so the cleanup step
          # can always find the tag — including when digest resolution below
          # fails after the bytes are already in the registry.
          {
            echo "image=$IMAGE_PATH"
            echo "final_tag=$FINAL_TAG"
            echo "staging_tag=$STAGING_TAG"
          } >> "$GITHUB_OUTPUT"

          docker tag "${{ env.LOCAL_IMAGE }}" "$IMAGE_PATH:$STAGING_TAG"
          docker push "$IMAGE_PATH:$STAGING_TAG" | tee staging-push.txt

          DIGEST="$(
            sed -nE 's/.*digest: (sha256:[0-9a-f]{64}).*/\1/p' \
              staging-push.txt | tail -n 1
          )"
          readonly DIGEST

          if ! [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Could not resolve the staged image digest."
            exit 1
          fi

          {
            echo "digest=$DIGEST"
            echo "ref=$IMAGE_PATH@$DIGEST"
          } >> "$GITHUB_OUTPUT"
          echo "Staged $IMAGE_PATH@$DIGEST for verification."

      - name: Sign image BY DIGEST (keyless / OIDC)
        run: |
          set -euo pipefail
          cosign sign --yes "${{ steps.stage.outputs.ref }}"

      - name: Verify signature before promotion
        run: |
          set -euo pipefail
          cosign verify "${{ steps.stage.outputs.ref }}" \
            --certificate-identity "$EXPECTED_COSIGN_IDENTITY" \
            --certificate-oidc-issuer "$EXPECTED_COSIGN_ISSUER" \
            --certificate-github-workflow-trigger push \
            --certificate-github-workflow-sha "$GITHUB_SHA" \
            > /dev/null
          echo "Signature verified."

      - name: Attest SBOM to the image digest (CycloneDX)
        run: |
          set -euo pipefail
          cosign attest --yes --type cyclonedx \
            --predicate trivy-sbom.json \
            "${{ steps.stage.outputs.ref }}"

      - name: Verify SBOM attestation before promotion
        run: |
          set -euo pipefail
          cosign verify-attestation --type cyclonedx \
            --certificate-identity "$EXPECTED_COSIGN_IDENTITY" \
            --certificate-oidc-issuer "$EXPECTED_COSIGN_ISSUER" \
            --certificate-github-workflow-trigger push \
            --certificate-github-workflow-sha "$GITHUB_SHA" \
            "${{ steps.stage.outputs.ref }}" > /dev/null
          echo "SBOM attestation verified."

      - name: Promote verified digest to the full commit SHA tag
        id: promote
        run: |
          set -euo pipefail
          readonly IMAGE_PATH="${{ steps.stage.outputs.image }}"
          readonly FINAL_TAG="${{ steps.stage.outputs.final_tag }}"
          readonly EXPECTED_DIGEST="${{ steps.stage.outputs.digest }}"
          readonly SOURCE_REF="${{ steps.stage.outputs.ref }}"

          # Promote from the already signed and verified registry digest. This
          # avoids a second local push whose digest could diverge after the tag
          # becomes visible. --prefer-index=false preserves a single-manifest
          # source instead of wrapping it in a new index with a different digest.
          docker buildx imagetools create \
            --prefer-index=false \
            --tag "$IMAGE_PATH:$FINAL_TAG" \
            "$SOURCE_REF"

          FINAL_DIGEST="$(
            docker buildx imagetools inspect "$IMAGE_PATH:$FINAL_TAG" \
              --format '{{json .Manifest}}' \
              | jq -r '.digest // empty'
          )"
          readonly FINAL_DIGEST

          if [[ "$FINAL_DIGEST" != "$EXPECTED_DIGEST" ]]; then
            echo "::error::Promotion digest mismatch: expected $EXPECTED_DIGEST, got ${FINAL_DIGEST:-missing}."
            exit 1
          fi

          echo "ref=$IMAGE_PATH@$FINAL_DIGEST" >> "$GITHUB_OUTPUT"
          echo "Promoted verified artifact to $IMAGE_PATH:$FINAL_TAG."

      - name: Publish promoted digest to job summary
        run: |
          {
            echo "### 📦 Promoted, Signed & Attested Artifact"
            echo "- **Image:** \`${{ steps.stage.outputs.image }}\`"
            echo "- **Release tag:** \`${{ steps.stage.outputs.final_tag }}\` (full commit SHA)"
            echo "- **Digest (preferred):** \`${{ steps.promote.outputs.ref }}\`"
            echo "- **Note:** \`:latest\` is intentionally not published"
            echo "- **Staging tag:** \`${{ steps.stage.outputs.staging_tag }}\` (pending verified cleanup — see the line below)"
            echo "- **Signing:** Keyless (Sigstore Fulcio + Rekor transparency log)"
            echo "- **SBOM:** CycloneDX attested to the digest"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the staging tag from the registry
        # The staging tag is pushed BEFORE signing and verification, so an image
        # that fails `cosign verify` would otherwise stay published and pullable.
        # This runs on the failure path too — that is the whole point. The final
        # commit-SHA tag is never touched.
        #
        # Endpoint choices, checked against Docker Hub's published OpenAPI spec:
        #   * Auth uses the documented POST /v2/auth/token ({identifier, secret}
        #     -> access_token), the PAT-oriented flow. Only an explicit 404/405
        #     falls back to the older POST /v2/users/login
        #     ({username, password} -> token). Authentication errors, rate limits,
        #     server errors and transport failures remain fail-closed.
        #   * Tag deletion has NO documented endpoint. The spec exposes only
        #     GET/HEAD on .../tags/{tag} and defines no tag DELETE anywhere, so
        #     the /v2/repositories/{ns}/{repo}/tags/{tag}/ DELETE used below is
        #     undocumented-but-working. Its status code is therefore never
        #     trusted: removal is confirmed by re-reading the tag afterwards.
        #   * A bare 404 on the tag is NOT proof of deletion — a wrong namespace
        #     returns 404 too. So the repository itself is checked for HTTP 200
        #     first, which makes a subsequent tag 404 meaningful.
        if: ${{ always() && steps.stage.outputs.staging_tag != '' }}
        env:
          REGISTRY_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}
          STAGING_TAG: ${{ steps.stage.outputs.staging_tag }}
        run: |
          set -euo pipefail

          readonly HUB='https://hub.docker.com'
          readonly REPO_URL="${HUB}/v2/namespaces/${REGISTRY_USERNAME}/repositories/${IMAGE_NAME}"
          readonly TAG_URL="${REPO_URL}/tags/${STAGING_TAG}"
          # No documented modern equivalent exists for tag deletion (see above).
          readonly LEGACY_DELETE_URL="${HUB}/v2/repositories/${REGISTRY_USERNAME}/${IMAGE_NAME}/tags/${STAGING_TAG}/"

          # `Validate delivery configuration` already restricts REGISTRY to Docker
          # Hub, so anything else reaching this point is a broken invariant rather
          # than a supported path — fail loudly instead of skipping cleanup.
          case "$REGISTRY" in
            docker.io|index.docker.io|registry-1.docker.io) ;;
            *) echo "::error::Unsupported REGISTRY '$REGISTRY' reached cleanup."; exit 1 ;;
          esac

          # Keep secret-derived values out of argv, where any process on the
          # runner could read them via `ps`:
          #   * jq takes the credential from the environment (env.*), not --arg.
          #   * the Authorization header goes in a 0600 curl config file passed
          #     with --config, not on the command line via -H.
          # `printf` and the assignments below are bash builtins, so they spawn
          # no process and expose nothing. (Actions also masks secrets in logs,
          # but that does nothing about argv on the runner itself.)
          umask 077
          WORKDIR="$(mktemp -d)"
          readonly WORKDIR
          trap 'rm -rf "$WORKDIR"' EXIT
          readonly AUTH_CFG="${WORKDIR}/auth.conf"
          readonly BODY="${WORKDIR}/body.json"
          readonly RESPONSE="${WORKDIR}/response.json"

          authenticate() {
            local http_code token

            CLEANUP_ID="$REGISTRY_USERNAME" CLEANUP_SECRET="$REGISTRY_PASSWORD" \
              jq -nc '{identifier: env.CLEANUP_ID, secret: env.CLEANUP_SECRET}' > "$BODY"
            http_code="$(
              curl -sS -o "$RESPONSE" -w '%{http_code}' --max-time 30 \
                -X POST "${HUB}/v2/auth/token" \
                -H 'Content-Type: application/json' --data-binary "@${BODY}"
            )" || http_code='000'
            rm -f "$BODY"

            if [[ "$http_code" == "200" ]]; then
              token="$(jq -r '.access_token // empty' "$RESPONSE")"
              rm -f "$RESPONSE"
              if [[ -n "$token" ]]; then
                printf 'header = "Authorization: Bearer %s"\n' "$token" > "$AUTH_CFG"
                return 0
              fi
              echo "Modern token endpoint returned HTTP 200 without an access_token."
              return 1
            fi

            rm -f "$RESPONSE"
            case "$http_code" in
              404|405)
                echo "Modern token endpoint returned HTTP $http_code; trying the documented legacy login fallback."
                ;;
              *)
                echo "Modern token endpoint failed with HTTP $http_code; refusing legacy auth downgrade."
                return 1
                ;;
            esac

            CLEANUP_ID="$REGISTRY_USERNAME" CLEANUP_SECRET="$REGISTRY_PASSWORD" \
              jq -nc '{username: env.CLEANUP_ID, password: env.CLEANUP_SECRET}' > "$BODY"
            token="$(
              curl -sS --fail --max-time 30 -X POST "${HUB}/v2/users/login" \
                -H 'Content-Type: application/json' --data-binary "@${BODY}" \
              | jq -r '.token // empty'
            )" || token=''
            rm -f "$BODY"
            if [[ -n "$token" ]]; then
              echo "Token endpoint unavailable; fell back to the legacy login flow."
              printf 'header = "Authorization: JWT %s"\n' "$token" > "$AUTH_CFG"
              return 0
            fi

            return 1
          }

          status_of() {
            curl -sS -o /dev/null -w '%{http_code}' --max-time 30 \
              --config "$AUTH_CFG" "$1"
          }

          # Proves the namespace/repository path is correct. Without this, a 404 on
          # the tag is ambiguous — "deleted" and "wrong repo, nothing was ever
          # checked" look identical — and the whole verification would be theatre.
          repo_reachable() {
            [[ "$(status_of "$REPO_URL")" == "200" ]]
          }

          cleanup_once() {
            local before after

            repo_reachable || { echo "Repository ${REGISTRY_USERNAME}/${IMAGE_NAME} not reachable."; return 1; }

            before="$(status_of "$TAG_URL")"
            if [[ "$before" == "404" ]]; then
              # Repo is reachable and the tag is already absent. Do not claim it
              # was never published; a prior cleanup could have removed it.
              report "already absent — nothing to remove"
              return 0
            fi

            curl -sS -o /dev/null --max-time 30 -X DELETE \
              --config "$AUTH_CFG" "$LEGACY_DELETE_URL" || true

            # Success is decided by this re-read, never by the DELETE status code.
            after="$(status_of "$TAG_URL")"
            if [[ "$after" == "404" ]]; then
              report "deleted, verified absent by re-read"
              return 0
            fi

            echo "Tag still present after delete (HTTP $after)."
            return 1
          }

          # Written only once an outcome is known, so the summary never claims a
          # cleanup that has not actually been verified.
          report() {
            echo "Staging tag '$STAGING_TAG': $1."
            echo "- **Staging tag cleanup:** \`${STAGING_TAG}\` — $1" >> "$GITHUB_STEP_SUMMARY"
          }

          for attempt in 1 2 3; do
            if authenticate && cleanup_once; then
              exit 0
            fi
            if (( attempt < 3 )); then
              echo "Cleanup attempt $attempt did not verify; retrying in 5s."
              sleep 5
            fi
          done

          echo "- **Staging tag cleanup:** ⚠️ \`${STAGING_TAG}\` COULD NOT be confirmed removed — delete it manually" >> "$GITHUB_STEP_SUMMARY"

          echo "::error::Could not confirm removal of '${REGISTRY_USERNAME}/${IMAGE_NAME}:${STAGING_TAG}'. Delete it manually — it was published before signature verification."
          exit 1

  # =================================================================
  # STAGE 3: DAST  (reuses the exact scanned image — no 3rd rebuild)
  # =================================================================
  dast_zap_ci:
    needs: [build_scan]
    runs-on: ubuntu-24.04
    name: 🎯 ZAP Baseline (${{ matrix.route }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - route: root
            path: /
          - route: health
            path: /health
          - route: weather-fallback
            path: /weather
          - route: robots
            path: /robots.txt
    env:
      ZAP_ROUTE: ${{ matrix.path }}
    # Enforcing: both FAIL and unreviewed WARN findings block promotion.
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout ZAP policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download built image (no rebuild)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: app-image

      - name: Load & run the scanned image
        run: |
          set -euo pipefail
          docker load -i image.tar

          # Trust boundary: this endpoint exists only on the ephemeral runner's
          # local Docker bridge. Bind it to that interface instead of 0.0.0.0 so
          # it is unreachable from the runner's other network interfaces.
          HOST_GW="$(docker network inspect bridge \
            --format '{{ (index .IPAM.Config 0).Gateway }}')"
          readonly HOST_GW
          if ! [[ "$HOST_GW" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]]; then
            echo "::error::Docker bridge returned an invalid IPv4 gateway"
            exit 1
          fi

          docker run -d --name app -p "${HOST_GW}:3000:3000" \
            -e OPENWEATHER_API_KEY="dummy" \
            -e OPENWEATHER_TIMEOUT_MS="3000" \
            "${{ env.LOCAL_IMAGE }}"

          # Readiness probe instead of a blind sleep.
          READY=false
          for i in $(seq 1 30); do
            if curl --fail --silent --show-error \
              --max-time 2 "http://${HOST_GW}:3000" >/dev/null; then # NOSONAR
              echo "App is up (attempt $i)."
              READY=true
              break
            fi
            sleep 2
          done
          if [[ "$READY" != true ]]; then
            echo "::error::App did not become ready for the ZAP scan"
            docker logs app
            exit 1
          fi

          # Intentional cleartext: ZAP reaches only this bridge-bound, ephemeral
          # test endpoint. No credentials or production data traverse the link.
          echo "ZAP_TARGET=http://${HOST_GW}:3000${ZAP_ROUTE}" >> "$GITHUB_ENV" # NOSONAR

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          docker_name: 'ghcr.io/zaproxy/zaproxy:2.17.0@sha256:8d387b1a63e3425beef4846e39719f5af2a787753af2d8b6558c6257d7a577a2'
          target: ${{ env.ZAP_TARGET }}
          rules_file_name: '.zap/rules.tsv'
          allow_issue_writing: false
          artifact_name: zap-baseline-${{ matrix.route }}
          fail_action: true

  # =================================================================
  # FINAL SUMMARY  (dynamic — reads the real outcome of each job)
  # =================================================================
  summary:
    needs: [test_and_sast, security_audit, build_scan, deliver_sign, dast_zap_ci]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    name: 🧾 Summary
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Build summary and enforce aggregate gate
        if: ${{ always() }}
        env:
          TEST_AND_SAST_RESULT: ${{ needs.test_and_sast.result }}
          SECURITY_AUDIT_RESULT: ${{ needs.security_audit.result }}
          SONAR_GATE_RESULT: ${{ needs.test_and_sast.outputs.sonar_gate }}
          SNYK_GATE_RESULT: ${{ needs.security_audit.outputs.snyk_gate }}
          BUILD_SCAN_RESULT: ${{ needs.build_scan.result }}
          DAST_RESULT: ${{ needs.dast_zap_ci.result }}
          DELIVER_SIGN_RESULT: ${{ needs.deliver_sign.result }}
          PUBLISH_REQUIRED: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
          # MUST stay identical to the `if:` on the Sonar and Snyk steps. If this
          # drifts, the aggregate gate below fails every run — loudly, which is
          # the intended direction for a mismatch. The dependabot[bot] term is
          # not redundant with the fork check: Dependabot PRs are same-repo, so
          # they pass the fork test, but they run with Dependabot secrets and
          # cannot see SONAR_TOKEN / SNYK_TOKEN.
          TRUSTED_SCANNERS_REQUIRED: ${{ github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        run: |
          set -euo pipefail

          icon() {
            case "$1" in
              success)   echo "✅" ;;
              failure)   echo "❌" ;;
              skipped)   echo "⏭️" ;;
              cancelled) echo "🚫" ;;
              *)         echo "❓" ;;
            esac
          }

          gate_failed=0

          require_success() {
            local stage="$1"
            local result="$2"

            if [[ "$result" != "success" ]]; then
              printf '::error title=Pipeline gate failed::%s result=%s\n' \
                "$stage" "$result"
              gate_failed=1
            fi
          }

          require_success "Test and quality" "$TEST_AND_SAST_RESULT"
          require_success "Security audit" "$SECURITY_AUDIT_RESULT"
          require_success "Build and image scan" "$BUILD_SCAN_RESULT"
          require_success "DAST" "$DAST_RESULT"

          if [[ "$PUBLISH_REQUIRED" == "true" ]]; then
            require_success "Delivery, signing and attestation" "$DELIVER_SIGN_RESULT"
          elif [[ "$DELIVER_SIGN_RESULT" != "skipped" ]]; then
            printf '::error title=Unexpected delivery::delivery result=%s on a non-publish event\n' \
              "$DELIVER_SIGN_RESULT"
            gate_failed=1
          fi

          if [[ "$TRUSTED_SCANNERS_REQUIRED" == "true" ]]; then
            if [[ "$SONAR_GATE_RESULT" == "success" && "$SNYK_GATE_RESULT" == "success" ]]; then
              trusted_scanner_status="✅ passed"
            else
              trusted_scanner_status="❌ Sonar=$SONAR_GATE_RESULT, Snyk=$SNYK_GATE_RESULT"
              echo "::error::Trusted Sonar/Snyk gates did not both execute successfully."
              gate_failed=1
            fi
          else
            if [[ "$SONAR_GATE_RESULT" == "skipped" && "$SNYK_GATE_RESULT" == "skipped" ]]; then
              trusted_scanner_status="🛡️ intentionally skipped (fork PR or Dependabot — no access to Actions secrets)"
            else
              trusted_scanner_status="❌ unexpected Sonar=$SONAR_GATE_RESULT, Snyk=$SNYK_GATE_RESULT"
              echo "::error::Secret-backed scanner executed on a run without access to Actions secrets."
              gate_failed=1
            fi
          fi

          {
            echo "## DevSecOps Pipeline — Status"
            echo
            echo "| Stage | Result |"
            echo "|---|---|"
            printf '| 🧱 Test & Quality | %s %s |\n' \
              "$(icon "$TEST_AND_SAST_RESULT")" "$TEST_AND_SAST_RESULT"
            printf '| 🧩 SCA / License / FS | %s %s |\n' \
              "$(icon "$SECURITY_AUDIT_RESULT")" "$SECURITY_AUDIT_RESULT"
            printf '| 🔐 Sonar / Snyk (secret-backed runs) | %s |\n' \
              "$trusted_scanner_status"
            printf '| 🧪 Build & Image Scan | %s %s |\n' \
              "$(icon "$BUILD_SCAN_RESULT")" "$BUILD_SCAN_RESULT"
            printf '| 🎯 DAST (ZAP) | %s %s |\n' \
              "$(icon "$DAST_RESULT")" "$DAST_RESULT"
            printf '| 📦🔏 Deliver / Sign / Attest | %s %s |\n' \
              "$(icon "$DELIVER_SIGN_RESULT")" "$DELIVER_SIGN_RESULT"
            echo
            echo "_Publish policy (master pushes only): single build → scanned → DAST → staged by digest → signed/attested and verified → promoted by full commit SHA._"
            echo
            echo "_Gate policy: npm audit + deterministic lockfile license inventory + Trivy on every event · Sonar/Snyk on every secret-backed ref, including pre-merge same-repo PRs (fork PRs and Dependabot excluded) · ZAP route matrix WARN/FAIL · Cosign keyless · fail-closed staging-tag cleanup with post-delete re-read._"
          } >> "$GITHUB_STEP_SUMMARY"

          if (( gate_failed != 0 )); then
            echo "::error::One or more mandatory pipeline gates did not succeed."
            exit 1
          fi
