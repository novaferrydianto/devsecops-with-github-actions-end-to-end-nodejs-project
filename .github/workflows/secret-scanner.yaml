name: Secret Scanning (TruffleHog)

concurrency:
  group: secret-scanner-${{ github.ref }}
  cancel-in-progress: true

# ✅ PoLP Permissions (Hanya yang diperlukan)
permissions:
  contents: read

on:
  pull_request:
    branches: [master]

jobs:
  secret_scan:
    name: 🕵️ Secret Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SECRET_COUNT: '0'
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # =============================
      # 1) INSTALL TRUFFLEHOG V3 (checksum + Sigstore signature verified)
      # =============================
      - name: 🛠️ Install TruffleHog (verified download)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO="trufflesecurity/trufflehog"
          VERSION=$(gh api "repos/$REPO/releases/latest" --jq '.tag_name | ltrimstr("v")')
          BASE="https://github.com/$REPO/releases/download/v${VERSION}"
          FILE="trufflehog_${VERSION}_linux_amd64.tar.gz"

          curl -sSfL --proto '=https' -O "$BASE/$FILE"
          curl -sSfL --proto '=https' -O "$BASE/trufflehog_${VERSION}_checksums.txt"
          curl -sSfL --proto '=https' -O "$BASE/trufflehog_${VERSION}_checksums.txt.pem"
          curl -sSfL --proto '=https' -O "$BASE/trufflehog_${VERSION}_checksums.txt.sig"

          # The checksums file is itself Sigstore-signed by trufflehog's own release
          # workflow -- verify that signature before trusting anything it lists.
          cosign verify-blob \
            --certificate "trufflehog_${VERSION}_checksums.txt.pem" \
            --signature "trufflehog_${VERSION}_checksums.txt.sig" \
            --certificate-identity-regexp "^https://github.com/trufflesecurity/trufflehog/\.github/workflows/release\.yml@refs/tags/v.+$" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "trufflehog_${VERSION}_checksums.txt"

          # Now that the checksums file is proven authentic, verify the binary archive against it.
          sha256sum --ignore-missing -c "trufflehog_${VERSION}_checksums.txt"

          tar -xzf "$FILE" trufflehog
          sudo install -m 0755 trufflehog /usr/local/bin/trufflehog
          trufflehog --version

      # =============================
      # 2) RUN SCAN & EXTRACT NDJSON
      # =============================
      - name: 🚨 Run TruffleHog Scan
        run: |
          # Hanya deteksi secret yang "Verified" (aktif/valid) agar tidak banyak false positive
          trufflehog git . --only-verified --json --no-update > trufflehog-report.json || true

      # =============================
      # 3) PARSE NDJSON TO ARRAY
      # =============================
      - name: 📊 Parse Secret Findings
        id: parse
        run: |
          COUNT=$(jq -s 'length' trufflehog-report.json 2>/dev/null || echo "0")
          echo "SECRET_COUNT=$COUNT" >> "$GITHUB_ENV"
          
          if [ "$COUNT" -gt 0 ]; then
            echo "Found $COUNT verified secrets!"
            {
              echo "### 🚨 Verified Secrets Found: $COUNT"
              echo "| Detector | File | Line |"
              echo "|---|---|---|"
              jq -s -r '.[] | "| \(.DetectorName) | \(.SourceMetadata.Data.Git.file) | \(.SourceMetadata.Data.Git.line) |"' trufflehog-report.json
            } > issue-body.md
          else
            echo "✅ No verified secrets found."
          fi

      # =============================
      # 4) AUTO COMMENT ON PR
      # =============================
      - name: 💬 Comment on PR
        if: env.SECRET_COUNT != '0'
        uses: step-security/sticky-pull-request-comment@3f74a8f2b4dc745810ded9bbfd887679bccd13c2 # v3.0.5
        with:
          recreate: true
          message: |
            ## 🛑 Blocked: Verified Secret(s) Detected!
            TruffleHog found **${{ env.SECRET_COUNT }}** active secret(s) in this Pull Request.
            For security reasons, this PR cannot be merged until the secrets are revoked and removed from the commit history.
            *Check the Security Issue for details.*

      # =============================
      # 5) SMART CREATE OR UPDATE ISSUE (ANTI-SPAM)
      # =============================
      - name: 📝 Create or Update Issue (Idempotent)
        if: env.SECRET_COUNT != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Mengecek tiket keamanan yang masih aktif..."
          # Cari 1 issue terbuka dengan label 'secrets-leak'
          EXISTING_ISSUE=$(gh issue list --label "secrets-leak" --state open --json number --jq '.[0].number')
          
          if [ -z "$EXISTING_ISSUE" ] || [ "$EXISTING_ISSUE" = "null" ]; then
            echo "Belum ada tiket. Membuat tiket baru..."
            gh issue create \
              --title "🚨 Verified Secret Leak Detected in PR #${{ github.event.pull_request.number }}" \
              --body-file issue-body.md \
              --label "security,high-risk,secrets-leak"
          else
            echo "Tiket sudah ada (#$EXISTING_ISSUE). Menambahkan komentar update agar tidak spam..."
            gh issue comment "$EXISTING_ISSUE" --body "⚠️ **Update**: TruffleHog mendeteksi secret masih ada pada commit terbaru."
            gh issue comment "$EXISTING_ISSUE" --body-file issue-body.md
          fi

      # =============================
      # 6) UPLOAD RAW REPORT
      # =============================
      - name: 📤 Upload Full Report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: env.SECRET_COUNT != '0'
        with:
          name: trufflehog-full-report
          path: trufflehog-report.json

      # =============================
      # 7) FAIL JOB → BLOCK PR MERGE
      # =============================
      - name: ❌ Fail the build
        if: env.SECRET_COUNT != '0'
        run: |
          echo "❌ Active secret leak detected. Blocking PR merge to protect SawitPRO."
          exit 1
