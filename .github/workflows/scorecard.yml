name: Scorecard supply-chain security

on:
  branch_protection_rule:
  schedule:
    - cron: '16 10 * * 2'
  push:
    branches: [ "master" ]

# ✅ PoLP: Global lockdown to read-only
permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event.repository.default_branch == github.ref_name
    
    permissions:
      security-events: write # Untuk upload SARIF ke tab Security
      id-token: write        # Untuk mempublikasikan hasil ke OpenSSF (OIDC)
      contents: read         # Diperlukan untuk checkout

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            api.osv.dev:443
            api.securityscorecards.dev:443
            bestpractices.coreinfrastructure.org:443
            fulcio.sigstore.dev:443
            github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            rekor.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443

      - name: "Checkout code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Run analysis"
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          repo_token: ${{ secrets.SCORECARD_TOKEN }}
          publish_results: true

      - name: "Upload artifact"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: SARIF_file
          path: results.sarif
          retention-days: 5

  upload-results:
    name: Upload Scorecard results
    needs: analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.repository.default_branch == github.ref_name

    permissions:
      security-events: write
      contents: read

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            uploads.githubusercontent.com:443

      - name: "Checkout code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Download artifact"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: SARIF_file
          path: .

      - name: "Sanitize SARIF"
        # Menghapus teks "no file associated with this alert" dan menggantinya dengan "."
        # agar valid di GitHub Code Scanning.
        # Job ini diizinkan memiliki step 'run' karena tidak memproses direktif publish_results.
        run: sed -i 's/no file associated with this alert/./g' results.sarif

      - name: "Upload to code-scanning"
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          sarif_file: results.sarif
