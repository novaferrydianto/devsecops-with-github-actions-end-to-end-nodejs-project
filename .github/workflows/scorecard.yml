name: Scorecard supply-chain security

on:
  branch_protection_rule:
  schedule:
    - cron: '16 10 * * 2'
  push:
    branches: [ "master" ]

# ✅ PoLP: Global lockdown to read-only
permissions:
  contents: read

# Prevent duplicate scheduled/push analyses from consuming runners concurrently.
concurrency:
  group: scorecard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: github.event.repository.default_branch == github.ref_name
    
    permissions:
      security-events: write # Untuk upload SARIF ke tab Security
      id-token: write        # Untuk mempublikasikan hasil ke OpenSSF (OIDC)
      contents: read         # Diperlukan untuk checkout

    steps:
      - name: Harden the runner (block unapproved egress)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            api.osv.dev:443
            api.securityscorecards.dev:443
            bestpractices.coreinfrastructure.org:443
            fulcio.sigstore.dev:443
            github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            rekor.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            *.actions.githubusercontent.com:443

      - name: "Checkout code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Run analysis"
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Use the short-lived job token constrained by the permissions above.
          repo_token: ${{ github.token }}
          publish_results: true

      - name: "Upload artifact"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: SARIF_file
          path: results.sarif
          retention-days: 5

  upload-results:
    name: Upload Scorecard results
    needs: analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: github.event.repository.default_branch == github.ref_name

    permissions:
      security-events: write
      contents: read

    steps:
      - name: Harden the runner (block unapproved egress)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            uploads.githubusercontent.com:443

      - name: "Checkout code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Download artifact"
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: SARIF_file
          path: .

      - name: "Sanitize SARIF"
        # Menghapus teks "no file associated with this alert" dan menggantinya dengan "."
        # agar valid di GitHub Code Scanning.
        # Job ini diizinkan memiliki step 'run' karena tidak memproses direktif publish_results.
        run: sed -i 's/no file associated with this alert/./g' results.sarif

      - name: "Upload to code-scanning"
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          sarif_file: results.sarif
