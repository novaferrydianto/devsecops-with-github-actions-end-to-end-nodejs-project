name: "🛠️ Security Scanner Operational Failure"
description: "Report a scanner execution, integration, timeout, or redacted CI failure. Never report vulnerability or secret details here."
title: "🛠️ [SEC-SCANNER-OPS]: <Redacted summary>"
labels: ["security"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        ## Public operational report only

        Use this form only when a security scanner failed to execute or publish a trustworthy result.
        **Do not include secrets, tokens, exploit details, vulnerable code, raw scanner output, or unredacted artifacts.**
        Report vulnerabilities and secret exposure through the private security link in the issue chooser.

  - type: dropdown
    id: scanner-type
    attributes:
      label: Scanner
      description: Select the scanner that had an operational failure.
      multiple: false
      options:
        - "Snyk (SCA)"
        - "SonarQube Cloud (SAST / Quality Gate)"
        - "Trivy (FS / IaC / Image)"
        - "OWASP ZAP (DAST)"
        - "TruffleHog (Secret Detection)"
        - "CodeQL (SAST)"
        - "OpenSSF Scorecard"
        - "Other"
    validations:
      required: true

  - type: dropdown
    id: failure-class
    attributes:
      label: Failure class
      description: Describe the operational control that failed, not the security finding.
      options:
        - "Scanner could not start or crashed"
        - "Dependency or verified binary download failed"
        - "Checksum or signature verification failed"
        - "Deny-all egress blocked a required endpoint"
        - "Authentication or rate-limit failure"
        - "Timeout or runner-capacity failure"
        - "Report parsing or upload failed"
        - "Other operational failure"
    validations:
      required: true

  - type: input
    id: workflow-run
    attributes:
      label: Workflow run URL
      description: Link to the failed GitHub Actions run. Confirm its visible logs contain no sensitive material first.
      placeholder: "https://github.com/OWNER/REPO/actions/runs/RUN_ID"
    validations:
      required: true

  - type: textarea
    id: redacted-error
    attributes:
      label: Redacted error summary
      description: Summarize the failing step and exit code. Do not paste raw logs or scanner reports.
      placeholder: |
        - Failing job/step:
        - Exit code or GitHub annotation:
        - Last known successful run:
        - Redacted operational impact:
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Safe reproduction and attempted recovery
      description: Include only non-sensitive commands/configuration and reversible recovery steps already attempted.
      placeholder: |
        1. Re-run result:
        2. Endpoint/tool/version checked:
        3. Rollback or retry attempted:
    validations:
      required: true

  - type: checkboxes
    id: public-safety-confirmation
    attributes:
      label: Public disclosure safety confirmation
      options:
        - label: "I removed all secrets, tokens, credentials, cookies, internal endpoints, and personal data."
          required: true
        - label: "I did not attach raw SARIF, NDJSON, scanner output, or other security artifacts."
          required: true
        - label: "This report concerns scanner operation only; vulnerability or secret details were routed privately."
          required: true

  - type: textarea
    id: additional-notes
    attributes:
      label: Additional redacted context
      description: Optional operational context that is safe to disclose publicly.
    validations:
      required: false
