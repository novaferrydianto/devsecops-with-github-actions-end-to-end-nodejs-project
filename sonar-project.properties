# Identitas Proyek
sonar.projectKey=devsecopsganodejs
sonar.organization=devsecopsganodejs

# Metadata (Opsional tapi disarankan)
sonar.projectName=DevSecOps Node.js Project
sonar.projectVersion=1.0

# Path Source Code & Analisis
sonar.sources=.
sonar.exclusions=**/node_modules/**, **/test/**, **/*.test.js
sonar.tests=test
sonar.testExecutionReportPaths=xunit.xml

# Konfigurasi Coverage (Sesuai log Anda)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8

# scripts/test-pr-policy.py is the only Python file in this repo. It's
# executed in CI by pr-policy.yml on runs-on: ubuntu-24.04, whose bundled
# python3 is 3.12 -- pin analysis to that, not the "compatible with every
# Python 3" default, so the analyzer checks against the interpreter that
# actually runs it.
sonar.python.version=3.12

# scripts/test-pr-policy.py is a self-contained test harness for the
# pr-policy.yml governance logic (run via `python scripts/test-pr-policy.py`,
# not npm test), not application code. No Python coverage report is produced
# for it, same as test/**.js is not held to the JS coverage gate.
#
# scripts/coverage-makeover.js is a post-`npm run cover` cosmetic step (see
# package.json's cover script) that restyles the HTML coverage report after
# c8 has already run. It is outside c8's own `include` globs in package.json
# and is invoked as a standalone CLI step, never imported by a test -- same
# "not application code" rationale as test-pr-policy.py above.
sonar.coverage.exclusions=scripts/test-pr-policy.py, scripts/coverage-makeover.js

# docker:S8431 wants either a tag or a digest on a FROM line, never both.
# Dockerfile deliberately uses `image:tag@sha256:digest` on both stages
# instead: Docker still resolves and pulls by the immutable digest (the tag
# is inert at build time), but keeping the tag in the FROM line -- not just
# a comment above it -- is what lets Dependabot's docker-ecosystem updater
# track the correct moving tag per stage (":latest-dev" for the builder,
# ":latest" for the runtime stage) instead of silently comparing a bare
# digest against "latest" for every FROM line regardless of which tag it
# actually came from. This is a recognized SonarSource limitation, not a
# defect in this Dockerfile -- see the community thread confirming other
# projects (e.g. TryGhost) carry the same exclusion for the same reason:
# https://community.sonarsource.com/t/docker-s8431-makes-dependabot-upgrades-harder-to-read-and-limits-its-features/183693
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=docker:S8431
sonar.issue.ignore.multicriteria.e1.resourceKey=Dockerfile
